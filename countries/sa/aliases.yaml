# Spellings that normalise to Saudi Arabia in INSDC `country` / `geo_loc_name` fields.
# Matching rule (fhrs.rules.geo::normalise_country): the field is lower-cased and
# whitespace-collapsed; it is KSA iff, after splitting on the first sub-locality separator, the
# country part equals one of these aliases EXACTLY. A value that merely CONTAINS an alias
# ("USA:Canada,...,Saudi Arabia,...", "Saudi Arabian Gulf") is NOT KSA.
country: Saudi Arabia
gaz_root: GAZ:00005279
sublocality_separators: [":", " - ", "–", "—", ","]   # "Saudi Arabia: Jeddah", "Saudi Arabia:Thuwal"
aliases:
  - saudi arabia
  - kingdom of saudi arabia
  - ksa
  - k.s.a.
  - k.s.a
  - saudi-arabia
  - saudi arabien
  - arabie saoudite
  - arabia saudita
  - saudia
  - saudi
  - المملكة العربية السعودية
  - السعودية
  - السعوديه

# Wire-verified ENA Portal API query strings per alias (lowercase key). The Portal
# wildcard is unreliable in multi-word quoted strings; these exact forms returned
# rows against the production API (verified 2026-09-19/20 by the predecessor
# system). Aliases absent here fall back to `country="<alias>*"` when
# whitespace-free, and are skipped (loudly, in the harvest log) otherwise.
ena_queries:
  saudi: 'country="Saudi*"'
  ksa: 'country="KSA*"'
  kingdom of saudi arabia: 'country="Kingdom of Saudi*"'
  السعودية: 'country="السعودية*"'
  المملكة العربية السعودية: 'country="المملكة*"'

# Wire-verified DDBJ search-API geoLocName values per alias (lowercase key).
# geoLocName is a PREFIX match, so the short form "Saudi" catches both "Saudi" and
# "Saudi Arabia: …" — the full alias would miss the bare form (verified live by the
# predecessor system 2026-10-01: geoLocName=Saudi → 56,997; geoLocName=KSA → 100).
ddbj_queries:
  saudi: Saudi
  ksa: KSA

# Wire-verified NCBI esearch terms per alias, where the default
# (`<alias>[geo_loc_name]`, quoted when multi-word) is not what works. Empty here:
# the defaults reproduce the verified terms for this country's aliases.
ncbi_queries: {}
